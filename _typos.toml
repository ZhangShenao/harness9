# typos 拼写检查配置（https://github.com/crate-ci/typos）
# 项目专有术语白名单：随实际误报逐步补充
[default]
extend-ignore-identifiers-re = [
  "UDDG",       # DuckDuckGo 加密 URL 参数名（decodeUDDG）
  "harness9",
  "Ratatui",    # Rust TUI 框架名（ratatui），非 Ratatouille 拼写错误
  "HASS",       # Home Assistant 令牌前缀（HASS_TOKEN）
  "provid",     # AGENTS.md 架构图 ASCII 盒子里 provider 的有意截断
]

[default.extend-words]
harness9 = "harness9"

# 模型输出数据文件（SWE-bench predictions）：patch 内含上游代码片段、git hash、
# 上游源码的原样拼写（如 numpy 的 "determinstic"），属数据而非文档，拼写检查误报。
[files]
extend-exclude = [
  "**/predictions*.jsonl",
  "swebench-smoke/predictions.jsonl",
]
