#### Codex 原生图片生成硬契约

1. **先加载技能**：生成任何位图资产前，必须先使用内置 `$imagegen` 技能，完整遵循它的 built-in tool mode、保存路径和验收规则。
2. **逐图初始生成**：每个独立资产必须且只能执行 1 次初始 `image_gen` 调用；不得用一次调用捆绑多个不同图片，不得用 `n` 代替不同 Prompt 的逐图调用。这里的初始调用不包含第 6 条定义的针对性重试调用。
3. **数量下限与独立性**：至少生成 6 张正文 PNG 和 1 张封面 PNG。正文图文件名使用 kebab-case 和序号后缀；封面固定为 `cover.png`。封面必须由独立的 image_gen 调用生成，禁止复制、重命名、硬链接或复用任何正文 PNG 作为封面。
4. **生成后复制**：内置工具先把图片生成到 Codex 返回的 `$CODEX_HOME/generated_images/...` 路径。读取每次调用返回的确切路径，再把最终选中的文件复制到 `website/zh/blog/<slug>/images/`。不得假设 `image_gen` 接受项目目标路径参数。
5. **逐张视觉检查**：每次生成后都必须用 `view_image` 打开输出，核对主题、架构关系、文字准确性、风格、构图、16:9 比例与禁用项。不能只检查文件名或命令退出码。
6. **最多一次针对性重试**：某张图未通过视觉检查时，在初始生成之外最多允许 1 次针对性重试调用；重试使用修正后的最终 Prompt，并作为独立的 `image_gen` 调用。重试次数与初始调用次数分开计数。重试输出仍不合格则停止并报告该图阻塞，不得继续假装完成。
7. **Prompt 随文留档**：Markdown 必须保留每个最终入选 PNG 实际使用的完整最终 Prompt。若发生重试，替换为重试所用 Prompt，不能保留已经淘汰的版本冒充最终 Prompt。
8. **项目文件是交付物**：文章引用的每张图都必须实际存在于 `website/zh/blog/<slug>/images/`。不得让任何被 Markdown 引用的资产只留在 `$CODEX_HOME/generated_images`。
9. **禁止静默降级**：不得静默切换到 CLI、API、`scripts/image_gen.py`、自制 SDK 脚本或其他模型；也不得退化成只输出 Prompt、占位图片或要求用户自行生成。
10. **能力不可用即阻塞**：如果 `$imagegen` 或内置 `image_gen` 不可用或持续失败，立即停止图片交付并明确报告阻塞。可以说明存在需用户明确授权且依赖 `OPENAI_API_KEY` 的 CLI fallback，但未经用户明确同意不得调用。
11. **完成前检查存在性**：最终回复前，逐一检查文章中引用的所有 `./images/*.png` 在对应项目目录中真实存在、是 PNG 文件且可读取；缺少任意一张都不算完成。
12. **配置迁移任务例外**：如果当前请求明确只要求维护本 Agent 配置或验证契约，则不得在配置任务中生成博客图片。
13. **封面去重验收**：交付前计算 `cover.png` 与每张正文 PNG 的 SHA-256；任一摘要相同即视为封面缺失，必须重新生成独立封面。封面 Prompt 也必须与正文图 Prompt 不同，并符合场景叙事而非技术图表的专项规范。

#### 必须配图的内容类型

遇到以下内容必须配图：

- 架构分层 / 模块关系
- 数据流 / 控制流
- 状态机 / 生命周期
- 时序交互（多组件协作）
- 核心算法 / 关键路径
- 概念对比（Before vs After / A vs B）
- 系统整体鸟瞰
- 配置/策略关系树

#### 正文图片格式

在文章中需要配图的位置，**先用 Markdown 引用图片，再插入最终 Prompt 块**。图片文件名使用 kebab-case，描述图示内容，同一篇文章内按序号后缀区分，格式为 `<内容描述>-<序号>.png`，例如 `react-loop-overview-01.png`、`compactor-state-machine-02.png`。

```markdown
![图片描述 caption](./images/<filename>.png)

> 🎨 **图片最终 Prompt**（已用于内置 image_gen）
>
> *[图片描述 caption]*
>
> ```
> [实际传给 image_gen 并生成最终入选 PNG 的完整英文 Prompt]
> ```
```

Markdown 引用、最终 Prompt 和实际 PNG 必须一一对应。生成与视觉检查完成后，按 `<filename>.png` 把入选文件复制到同级 `images/` 目录。

