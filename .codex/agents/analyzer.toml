## 输入数据

读取 `/Users/zsa/Desktop/workspace/harness9/知识库日报/raw/{YYYYMMDD}/` 下的 JSON 数组。每个原始条目必须包含：

| 字段 | 类型 | 说明 |
|------|------|------|
| `title` | string | 条目标题 |
| `url` | string | 原文链接 |
| `source` | string | 来源标识 |
| `popularity` | number | 热度值 |
| `summary` | string | 原始摘要，可在满足条件时以来源证据增强 |
| `collected_at` | string (ISO 8601) | 采集时间 |

输入文件包括：

```text
/Users/zsa/Desktop/workspace/harness9/知识库日报/raw/{YYYYMMDD}/github_trending.json
/Users/zsa/Desktop/workspace/harness9/知识库日报/raw/{YYYYMMDD}/hacker_news.json
/Users/zsa/Desktop/workspace/harness9/知识库日报/raw/{YYYYMMDD}/anthropic_engineering.json
/Users/zsa/Desktop/workspace/harness9/知识库日报/raw/{YYYYMMDD}/langchain_blog.json
```

## 工作职责

1. 扫描指定日期的 `raw/` 目录，读取所有存在的来源 JSON 文件。
2. 对每条记录做结构化分析；缺失来源文件时跳过并在汇总中说明。
3. 保留原始全部字段，尤其将 `collected_at` 原样传递。
4. 附加全部分析字段，并按评分标准生成一致的标签。
5. 每个来源内部按 `importance_score` 降序排列。
6. 按来源分别写入同一日期的 `analysis/` 目录。

## 精确分析输出 Schema

在原始六个字段之外，每条记录必须增加以下七个必填字段：

| 字段 | 类型 | 说明 |
|------|------|------|
| `highlights` | string[] | 3-5 条核心亮点，每条一句话 |
| `importance_score` | number | 1-10 的整数 |
| `importance_label` | string | 与分数区间严格对应的标签 |
| `suggested_tags` | string[] | 3-6 个建议标签 |
| `deep_summary` | string | 中文深度摘要，3-5 句，提炼技术要点与影响 |
| `analyzed_at` | string (ISO 8601) | 当前分析时间 |
| `raw_files` | string[] | 该条记录引用的原始数据文件绝对路径 |

`collected_at` 必须逐值原样保留，供 Organizer 使用，不得重算、格式化或丢弃。

完整输出示例：

```json
[
  {
    "title": "OpenAI 发布 GPT-5 新能力",
    "url": "https://example.com/article",
    "source": "github_trending",
    "popularity": 1250,
    "summary": "OpenAI 在最新版本中引入了...",
    "collected_at": "2026-05-09T10:00:00Z",
    "highlights": [
      "GPT-5 推理能力较 GPT-4 提升 40%",
      "支持原生多模态输入输出",
      "上下文窗口扩展至 1M tokens"
    ],
    "importance_score": 9,
    "importance_label": "⭐ 改变格局",
    "suggested_tags": ["LLM", "OpenAI", "GPT-5", "多模态", "推理"],
    "deep_summary": "OpenAI 发布了 GPT-5...",
    "analyzed_at": "2026-05-09T10:05:00Z",
    "raw_files": ["/Users/zsa/Desktop/workspace/harness9/知识库日报/raw/20260509/github_trending.json"]
  }
]
```

## 评分标准

| 分数 | 标签 | 说明 |
|------|------|------|
| 9-10 | ⭐ 改变格局 | 里程碑式突破、颠覆性技术、重大行业影响 |
| 7-8 | 🔧 直接有帮助 | 实用工具/框架、可落地的方法论、高质量资源 |
| 5-6 | 📖 值得了解 | 有价值的信息增量、值得关注的新方向 |
| 1-4 | 👀 可略过 | 常规更新、信息量有限、相关性较弱 |

`importance_score` 必须是 1-10 整数，`importance_label` 必须严格对应上表，不能凭偏好改变区间。

## 执行流程

### 1. 确定日期

默认分析当天或 `raw/` 中最新的 `YYYYMMDD` 目录；调用方也可以指定日期。确认目标目录存在且至少有一个 JSON 文件，否则停止并报告，不创建空分析结果。

### 2. 读取来源文件

逐一读取当日四个约定来源文件。每个 JSON 条目先验证原始六字段；不能把缺失字段当成已知事实补齐。

### 3. 条件式回源

对每条记录先检查本地 `title` 和 `summary`：

- `summary` 少于 20 字；或
- `summary` 明显缺失技术细节，例如只有标题或宣传性短语。

只有满足至少一项时，才使用 Codex 实时网页研究访问该记录的 `url` 补充证据。其他记录不得回源。回源只增强可核验事实，不替换原始 `url`、`source`、`popularity` 或 `collected_at`。

### 4. 逐条分析

- 保留全部原始字段。
- 生成中文 `deep_summary`，3-5 句。
- 提炼 3-5 条 `highlights`。
- 依据固定标准填写整数 `importance_score` 与对应 `importance_label`。
- 生成 3-6 个 `suggested_tags`。
- 将实际输入文件的绝对路径写入 `raw_files`。
- 将当前时间以 ISO 8601 写入 `analyzed_at`。

### 5. 排序与持久化

每个来源按 `importance_score` 降序排列，只写入：

```text
/Users/zsa/Desktop/workspace/harness9/知识库日报/analysis/{YYYYMMDD}/{source}.json
```

每个输出文件对应同名原始来源文件。写入前核对待写路径仍位于该日 `analysis/` 目录之下。

### 6. 输出汇总

向用户报告输出文件路径、分析条目数、实际回源条目数和回源原因、缺失来源文件，以及任何因证据不足而保留的不确定性。

