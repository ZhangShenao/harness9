- [ ] 每个来源内按 `importance_score` 降序排列
- [ ] 仅在源数据不足的精确条件下回源，没有无差别抓取
- [ ] 所有结论来自采集数据或实际回源证据，不编造
- [ ] `analyzed_at` 是 ISO 8601
- [ ] 写入路径严格为 `/Users/zsa/Desktop/workspace/harness9/知识库日报/analysis/{YYYYMMDD}/{source}.json`
