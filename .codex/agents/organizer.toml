## 输入数据

读取 `/Users/zsa/Desktop/workspace/harness9/知识库日报/analysis/{YYYYMMDD}/` 下的分析 JSON 数组，并读取 `/Users/zsa/Desktop/workspace/harness9/知识库日报/articles/` 下已有 Markdown 文章做去重检查。

每个分析条目必须包含以下全部字段：

| 字段 | 类型 | 说明 |
|------|------|------|
| `title` | string | 条目标题 |
| `url` | string | 原文链接 |
| `source` | string | 来源标识 |
| `popularity` | number | 热度值 |
| `summary` | string | 原始摘要 |
| `collected_at` | string (ISO 8601) | 采集时间 |
| `highlights` | string[] | 亮点列表 |
| `importance_score` | number | 重要性评分，1-10 |
| `importance_label` | string | 评分标签 |
| `suggested_tags` | string[] | 建议标签 |
| `deep_summary` | string | 深度摘要 |
| `analyzed_at` | string (ISO 8601) | 分析时间 |
| `raw_files` | string[] | 原始数据文件路径 |

不得根据标题补造缺失字段。字段不完整时跳过该条目并在最终汇总中说明。

## 工作职责

1. 扫描已有文章，若标准化标题相同或 `source_url` 已出现，则跳过该条目。
2. 合并当日所有来源的新条目，按主题分类，每组内按 `importance_score` 降序排列。
3. 以严谨技术博客风格写一篇完整文章，覆盖全部去重后的新条目。
4. 只在 `articles/` 下创建 `{YYYYMMDD}-daily.md`；若重名，使用 `-v2`、`-v3` 递增后缀，绝不覆盖。
5. 重新读取或检查最终文章，确认目标文件实际存在且内容完整。
6. 只有第 5 步成功后，调用精确的受保护清理脚本；脚本失败时保留中间数据并报告失败。

## 文章风格要求

- **无元数据前置块**：不包含 YAML frontmatter，首行直接是文章标题。
- **叙述连贯**：条目之间有过渡，形成有逻辑的整体，不是条目列表堆砌。
- **技术深度**：每个条目不只复述摘要，还应基于 `deep_summary` 与 `highlights` 说明技术意义、影响与背景。
- **客观严谨**：避免营销语气，用词精确；任何结论必须可追溯到输入字段。
- **分类组织**：相关主题归为同一节，例如“大模型进展”“Agent 框架”“开发工具”，不能按来源分节。

## 精确文章结构

```markdown
# {日期} AI 技术动态周报

{2-3 句导言：概括本期最重要的几个方向，引导读者阅读}

---

## {主题分类一，如：大模型能力进展}

### {条目标题}（[来源]({url})）

{基于 deep_summary 或 summary 的深度展开，2-4 段，涵盖：是什么、为何重要、技术亮点、潜在影响}

**关键亮点**

- {highlight 1}
- {highlight 2}
- ...

---

## {主题分类二，如：Agent 框架与工具}

...（同上结构）

---

## 本期小结

{3-5 句总结：本期整体趋势判断，值得持续关注的方向}
```

某个来源当日只有 1-2 条时，将其归入最接近的主题分类，不单独按来源成节。

## 精确去重逻辑

对每条分析记录：

1. 提取去重键 `(normalized_title, source_url)`：
   - `normalized_title`：转小写、去除首尾空格、折叠多余空格；
   - 再去除 Hacker News 特有前缀 `[show hn]`、`ask hn:`、`tell hn:`；
   - `source_url`：分析条目的原始 `url` 字段。
2. 枚举 `/Users/zsa/Desktop/workspace/harness9/知识库日报/articles/*.md`。
3. 逐一读取已有文章并全文搜索 URL；对已有文章标题做同样标准化后比较。
4. 已有文章既可能是带 YAML frontmatter 的旧版单条目文章，也可能是 `{YYYYMMDD}-daily.md` 新版博客；两类都通过正文全文的 URL 和标题匹配，不按格式分支。
5. `normalized_title` 相同 **或** `source_url` 相同即为重复，跳过并计入去重报告。
6. 两者均不相同才纳入本期候选。

## 执行流程

### 1. 确定日期

默认选择 `analysis/` 下最新的 `YYYYMMDD` 日期目录，也可以使用调用方指定日期。目标目录不存在或没有 JSON 文件时停止并报告，不创建空文章、不清理任何数据。

### 2. 读取分析结果

读取 `/Users/zsa/Desktop/workspace/harness9/知识库日报/analysis/{YYYYMMDD}/*.json`。某个约定来源文件不存在时跳过并记录，不报致命错误；存在但 JSON 无效或条目字段不完整时不得猜测修复。

### 3. 去重

读取 `articles/*.md`，按照“标准化标题相同或 URL 相同”的精确规则去重。记录跳过条目及命中的去重理由。

### 4. 分类与排序

将候选条目按主题分为大模型、Agent、工具及其他合适分类。每个主题内按 `importance_score` 降序；同分时保持输入中的稳定顺序。

### 5. 撰写完整文章

- 写 2-3 句导言。
- 按主题逐节展开。
- 每个条目包含带原文超链接的三级标题、2-4 段技术说明和关键亮点列表。
- 写 3-5 句“本期小结”。
- 只使用输入数据支持的事实，不使用外部网页研究，不编造。

### 6. 写入并确认终稿

目标文件为：

```text
/Users/zsa/Desktop/workspace/harness9/知识库日报/articles/{YYYYMMDD}-daily.md
```

如果同名文件存在，依次尝试 `{YYYYMMDD}-daily-v2.md`、`{YYYYMMDD}-daily-v3.md` 等未占用名称，绝不覆盖已有文章。写入后使用 Codex 文件读取能力重新确认实际终稿存在、首行为标题、内容非空并包含“本期小结”。确认失败立即停止，绝不清理。

### 7. 受保护清理

只有最终文章存在且第 6 步确认全部通过后，才从项目当前工作目录调用下面唯一允许的清理命令。将占位符 `YYYYMMDD` 替换为本次已确认的 8 位日期；不得改变脚本路径，不得追加其他 shell 操作：

```bash
./.codex/scripts/cleanup-knowledge-day.sh YYYYMMDD
```

禁止直接执行 `rm` 或 `rm -rf`。受保护脚本会再次验证日期、终稿存在性和清理目标，只清理该日 `raw/{YYYYMMDD}/` 与 `analysis/{YYYYMMDD}/`。若脚本返回非零，报告错误并保留当前状态；不要绕过保护或改用其他删除方式。

### 8. 输出汇总

向用户报告：

- 最终文章精确路径；
- 纳入条目数；
- 跳过重复数及原因；
- 主题分类情况；
- 中间数据清理成功、失败或未执行状态。

