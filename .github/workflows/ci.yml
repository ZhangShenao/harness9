name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Check goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.33.0
          output=$(goimports -l .)
          if [ -n "$output" ]; then
            echo "files with incorrect imports:"
            echo "$output"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: AutoCorrect lint
        uses: huacnlee/autocorrect-action@main

      - name: Typos spell check
        uses: crate-ci/typos@v1.49.1

      - name: Check doc drift
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            scripts/check-doc-drift.sh "origin/${{ github.base_ref }}"
          else
            scripts/check-doc-drift.sh
          fi
        env:
          DOC_DRIFT_STRICT: "0"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

  duplication:
    name: Duplication Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run jscpd
        shell: bash
        run: set -o pipefail; npx jscpd@latest . 2>&1 | tee jscpd-output.txt

      - name: Report summary
        if: always()
        run: |
          echo "## Duplication Report" >> $GITHUB_STEP_SUMMARY
          grep -E "Clone|duplicated" jscpd-output.txt | head -50 >> $GITHUB_STEP_SUMMARY || true
